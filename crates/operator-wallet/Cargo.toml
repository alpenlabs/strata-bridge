[package]
name = "operator-wallet"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
strata-bridge-primitives.workspace = true

bdk_bitcoind_rpc.workspace = true
bdk_wallet = { workspace = true, features = ["rusqlite"] }
bitcoin-bosd.workspace = true
rand.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# Fireblocks custody (optional; enabled via the `fireblocks` feature).
hex = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = []
# Compiles the Fireblocks custody of the general funds and its REST/JWT/serde deps.
fireblocks = [
  "dep:hex",
  "dep:jsonwebtoken",
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
  "dep:sha2",
]
test-utils = []

[dev-dependencies]
corepc-node.workspace = true
operator-wallet = { path = ".", features = ["test-utils"] }
serial_test.workspace = true
tempfile.workspace = true
wiremock.workspace = true
