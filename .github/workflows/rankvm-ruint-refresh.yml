name: RankVM ruint refresh helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-05-01 --profile minimal
          rustup default nightly-2026-05-01

      - name: Update patched ruint release
        run: cargo update -p ruint --precise 1.20.0

      - name: Re-run the real compatibility proof
        run: |
          cargo test --locked -p strata-mosaic-client \
            --test rankvm_sp1_compat -- --nocapture

      - name: Commit refreshed lockfile
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already uses the patched ruint release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): update ruint after RUSTSEC-2026-0220"
          git push origin "HEAD:${TARGET_BRANCH}"
