name: RankVM lockfile helper

on:
  push:
    branches:
      - experiment/rankvm-compat-demo

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-05-01 --profile minimal
          rustup default nightly-2026-05-01

      - name: Resolve and compile the compatibility test
        run: cargo check -p strata-mosaic-client --tests

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rankvm-generated-lockfile
          path: Cargo.lock
          retention-days: 1
          if-no-files-found: error
