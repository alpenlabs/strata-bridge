name: RankVM lockfile helper

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - experiment/rankvm-compat-demo

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-05-01 --profile minimal --component rustfmt
          rustup default nightly-2026-05-01

      - name: Format compatibility test
        run: cargo fmt --all

      - name: Resolve and compile the compatibility test
        run: cargo check -p strata-mosaic-client --tests

      - name: Commit generated files to the experiment branch
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet -- Cargo.lock crates/mosaic-client/tests/rankvm_sp1_compat.rs; then
            echo "Generated files are already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/mosaic-client/tests/rankvm_sp1_compat.rs
          git commit -m "test(mosaic-client): record generated SP1 compatibility files"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rankvm-generated-files
          path: |
            Cargo.lock
            crates/mosaic-client/tests/rankvm_sp1_compat.rs
          retention-days: 1
          if-no-files-found: error
