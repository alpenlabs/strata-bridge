# Focused proof-of-concept check for the real SP1 verifier at Mosaic's current
# 132-signature compatibility boundary.
name: RankVM SP1 compatibility

on:
  pull_request:
    paths:
      - Cargo.lock
      - crates/mosaic-client/**
      - .github/workflows/rankvm-sp1-compat.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Real SP1 proof and Mosaic adaptor flow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install nightly-2026-05-01 --profile minimal
          rustup default nightly-2026-05-01

      - name: Run compatibility proof
        run: |
          cargo test --locked -p strata-mosaic-client \
            --test rankvm_sp1_compat -- --nocapture
