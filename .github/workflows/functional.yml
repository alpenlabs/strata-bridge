name: Functional tests

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  extract-rust-version:
    name: Extract toolchain version
    runs-on: ubuntu-latest
    outputs:
      nightly-version: ${{ steps.extract-version.outputs.nightly-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract Rust version
        id: extract-version
        uses: $/.github/actions/extract-rust-version

  discover-groups:
    name: Discover functional test groups
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: List test group directories
        id: list
        run: |
          # Keep in sync with SKIP_GROUPS_BY_DEFAULT in functional-tests/entry.py
          groups=$(find functional-tests/tests -mindepth 1 -maxdepth 1 -type d -not -name proofs -printf '%f\n' \
            | sort \
            | jq -R . \
            | jq -sc .)
          if [ "$groups" = "[]" ]; then
            echo "ERROR: no test groups found under functional-tests/tests" >&2
            exit 1
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "Discovered groups: $groups"

  lint:
    name: Lint functional test files
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: functional-tests
          activate-environment: true
          enable-cache: true
          cache-suffix: "functional-tests"
          python-version: "3.12"

      - name: Check formatting
        working-directory: functional-tests
        run: uv run ruff format --check

      - name: Check types
        working-directory: functional-tests
        run: uv run ty check

      - name: Lint
        working-directory: functional-tests
        run: uv run ruff check

  # Builds the instrumented bridge binaries (plus mosaic and asm-runner) once and hands them to
  # every test group as an artifact, so the matrix jobs neither compile nor restore a Rust cache.
  build:
    name: Build bridge binaries
    runs-on: ubuntu-latest
    needs: [extract-rust-version]
    timeout-minutes: 60
    env:
      OPENSSL_VERSION: "3.5.0"
      OPENSSL_CACHE_VERSION: "v2" # update this to refresh cache
      OPENSSL_INSTALL_DIR: ${{ github.workspace }}/.cache/openssl-3.5.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore cached OpenSSL build
        id: cache-openssl
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.OPENSSL_INSTALL_DIR }}
          key: ${{ runner.os }}-openssl-${{ env.OPENSSL_VERSION }}-${{ env.OPENSSL_CACHE_VERSION }}

      - name: Download and build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO --proto "=https" --tlsv1.2 \
            --retry 5 --retry-delay 5 --retry-all-errors --retry-max-time 300 \
            "https://www.openssl.org/source/openssl-$OPENSSL_VERSION.tar.gz"
          tar -xzf "openssl-$OPENSSL_VERSION.tar.gz"
          cd "openssl-$OPENSSL_VERSION"
          ./config --prefix="$OPENSSL_INSTALL_DIR" --openssldir="$OPENSSL_INSTALL_DIR"
          make -j"$(nproc)"
          make install_sw install_ssldirs

      - name: Configure OpenSSL environment
        run: |
          OPENSSL_LIB_DIR="$OPENSSL_INSTALL_DIR/lib64"
          if [ ! -d "$OPENSSL_LIB_DIR" ]; then
            OPENSSL_LIB_DIR="$OPENSSL_INSTALL_DIR/lib"
          fi
          {
            echo "OPENSSL_ROOT_DIR=$OPENSSL_INSTALL_DIR"
            echo "OPENSSL_DIR=$OPENSSL_INSTALL_DIR"
            echo "PKG_CONFIG_PATH=$OPENSSL_LIB_DIR/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            echo "LD_LIBRARY_PATH=$OPENSSL_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          } >> "$GITHUB_ENV"
          echo "$OPENSSL_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Cleanup space
        uses: $/.github/actions/cleanup # zizmor: ignore[unpinned-uses]

      - name: Install Rust toolchain
        env:
          RUST_NIGHTLY: ${{ needs.extract-rust-version.outputs.nightly-version }}
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal
          rustup default "$RUST_NIGHTLY"

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true

      - name: Install libclang for bindgen
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y libclang-dev

      - name: Setup FoundationDB client
        uses: $/.github/actions/setup-foundationdb

      - name: Build Cargo project
        run: |
          COV_TARGET_DIR="$GITHUB_WORKSPACE/target/llvm-cov-target"
          RUSTFLAGS="-Cinstrument-coverage" cargo build --locked --bin strata-bridge --target-dir "$COV_TARGET_DIR"
          RUSTFLAGS="-Cinstrument-coverage" cargo build --locked -p secret-service --bin secret-service --target-dir "$COV_TARGET_DIR"
          cargo build --locked --bin dev-cli --target-dir "$COV_TARGET_DIR"

      - name: Resolve external binary versions
        id: bin-versions
        run: |
          extract_cargo_git_ref() {
            local crate="$1"
            local dep_line
            dep_line=$(grep -E "^[[:space:]]*${crate}[[:space:]]*=" Cargo.toml | head -n 1)
            if [[ "$dep_line" =~ (rev|tag)[[:space:]]*=[[:space:]]*\"([^\"]+)\" ]]; then
              echo "${BASH_REMATCH[1]} ${BASH_REMATCH[2]}"
              return
            fi
            echo "ERROR: failed to extract ${crate} git ref from Cargo.toml" >&2
            exit 1
          }
          read -r MOSAIC_REF_TYPE MOSAIC_REF < <(extract_cargo_git_ref mosaic-rpc-api)
          read -r ASM_REF_TYPE ASM_REF < <(extract_cargo_git_ref strata-asm-worker)
          {
            echo "mosaic-ref-type=$MOSAIC_REF_TYPE"
            echo "mosaic-ref=$MOSAIC_REF"
            echo "asm-ref-type=$ASM_REF_TYPE"
            echo "asm-ref=$ASM_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Restore cached mosaic binary
        id: cache-mosaic
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/target/mosaic
          key: ${{ runner.os }}-mosaic-${{ steps.bin-versions.outputs.mosaic-ref-type }}-${{ steps.bin-versions.outputs.mosaic-ref }}-${{ needs.extract-rust-version.outputs.nightly-version }}

      - name: Install mosaic binary
        if: steps.cache-mosaic.outputs.cache-hit != 'true'
        env:
          MOSAIC_REF_TYPE: ${{ steps.bin-versions.outputs.mosaic-ref-type }}
          MOSAIC_REF: ${{ steps.bin-versions.outputs.mosaic-ref }}
        run: |
          cargo install --locked --git https://github.com/alpenlabs/mosaic "--$MOSAIC_REF_TYPE" "$MOSAIC_REF" --features=reduced-circuits --root "$GITHUB_WORKSPACE/target/mosaic" mosaic

      - name: Restore cached asm-runner binary
        id: cache-asm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ github.workspace }}/target/asm
          key: ${{ runner.os }}-asm-runner-${{ steps.bin-versions.outputs.asm-ref-type }}-${{ steps.bin-versions.outputs.asm-ref }}-${{ needs.extract-rust-version.outputs.nightly-version }}

      - name: Install asm binary
        if: steps.cache-asm.outputs.cache-hit != 'true'
        env:
          ASM_REF_TYPE: ${{ steps.bin-versions.outputs.asm-ref-type }}
          ASM_REF: ${{ steps.bin-versions.outputs.asm-ref }}
        run: |
          cargo install --locked --git https://github.com/alpenlabs/asm "--$ASM_REF_TYPE" "$ASM_REF" --root "$GITHUB_WORKSPACE/target/asm" strata-asm-runner

      - name: Package bridge binaries
        run: |
          OPENSSL_LIB_DIR="$OPENSSL_INSTALL_DIR/lib64"
          if [ ! -d "$OPENSSL_LIB_DIR" ]; then
            OPENSSL_LIB_DIR="$OPENSSL_INSTALL_DIR/lib"
          fi
          openssl_rel="${OPENSSL_INSTALL_DIR#"$GITHUB_WORKSPACE/"}"
          openssl_lib_rel="${OPENSSL_LIB_DIR#"$GITHUB_WORKSPACE/"}"
          # Workspace-relative paths so the test jobs unpack into the same layout the coverage
          # report expects. The binaries are dynamically linked against this OpenSSL build, and
          # gen_s2_tls.sh runs its `openssl` CLI, which needs the matching openssl.cnf.
          tar -I 'zstd -T0' -cf "$RUNNER_TEMP/bridge-binaries.tar.zst" \
            target/llvm-cov-target/debug/strata-bridge \
            target/llvm-cov-target/debug/secret-service \
            target/llvm-cov-target/debug/dev-cli \
            target/mosaic/bin \
            target/asm/bin \
            "$openssl_rel"/bin/openssl \
            "$openssl_rel"/openssl.cnf \
            "$openssl_lib_rel"/libssl.so* \
            "$openssl_lib_rel"/libcrypto.so*
          ls -lh "$RUNNER_TEMP/bridge-binaries.tar.zst"

      - name: Upload bridge binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-binaries
          path: ${{ runner.temp }}/bridge-binaries.tar.zst
          retention-days: 1
          if-no-files-found: error
          compression-level: 0 # already compressed

  run:
    name: Run functional tests and generate report (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: [extract-rust-version, discover-groups, build]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.discover-groups.outputs.groups) }}
    env:
      OPENSSL_INSTALL_DIR: ${{ github.workspace }}/.cache/openssl-3.5.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cleanup space
        uses: $/.github/actions/cleanup # zizmor: ignore[unpinned-uses]

      - name: Download bridge binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-binaries
          path: ${{ runner.temp }}/bridge-binaries

      - name: Unpack bridge binaries
        run: |
          tar -I zstd -xf "$RUNNER_TEMP/bridge-binaries/bridge-binaries.tar.zst" -C "$GITHUB_WORKSPACE"
          {
            echo "$GITHUB_WORKSPACE/target/mosaic/bin"
            echo "$GITHUB_WORKSPACE/target/asm/bin"
          } >> "$GITHUB_PATH"

      - name: Configure OpenSSL environment
        run: |
          OPENSSL_LIB_DIR="$OPENSSL_INSTALL_DIR/lib64"
          if [ ! -d "$OPENSSL_LIB_DIR" ]; then
            OPENSSL_LIB_DIR="$OPENSSL_INSTALL_DIR/lib"
          fi
          echo "LD_LIBRARY_PATH=$OPENSSL_LIB_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "$OPENSSL_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Install bitcoind
        uses: $/.github/actions/setup-bitcoind

      # Only `cargo llvm-cov report` needs Rust here; the binaries come from the build job.
      - name: Install Rust toolchain
        env:
          RUST_NIGHTLY: ${{ needs.extract-rust-version.outputs.nightly-version }}
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component llvm-tools-preview
          rustup default "$RUST_NIGHTLY"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b550161ef8a7bc4f2a671c0b03a18ac9ccedea1e # v2.79.1
        with:
          tool: cargo-llvm-cov

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: functional-tests
          activate-environment: true
          enable-cache: true
          cache-suffix: "functional-tests"

      - name: Setup FoundationDB client
        uses: $/.github/actions/setup-foundationdb

      - name: Setup FoundationDB server
        uses: $/.github/actions/setup-foundationdb-server

      - name: Run functional tests
        id: funcTestsRun
        continue-on-error: true
        shell: bash
        env:
          NO_COLOR: "1"
          LOG_LEVEL: "info"
          PYTHON_VERSION: "3.12" # NOTE: (@Rajil1213) build fails with 3.13 since bitcoinlib (>=0.7.5,<0.8) uses an old version of numpy
          TEST_GROUP: ${{ matrix.group }}
        run: |
          export LLVM_PROFILE_FILE="$GITHUB_WORKSPACE/target/llvm-cov-target/strata-%p-%m.profraw"
          NEWPATH="$GITHUB_WORKSPACE/target/llvm-cov-target/debug"
          export PATH="$NEWPATH:$PATH"
          echo "$PATH"
          echo "Making sure built binaries are available"
          which strata-bridge
          which secret-service
          which dev-cli
          cd functional-tests
          source ./env.bash
          uv run --python "$PYTHON_VERSION" python entry.py -g "$TEST_GROUP"

      - name: Generate combined coverage lcov
        id: genFunctionalLcov
        continue-on-error: true
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          # cargo-llvm-cov expects default target dir and adds llvm-cov-target itself
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          export LLVM_PROFILE_FILE="$GITHUB_WORKSPACE/target/llvm-cov-target/strata-%p-%m.profraw"
          cargo llvm-cov report --lcov > "lcov.functional.${TEST_GROUP}.info"
      - name: Upload coverage lcov artifact
        if: steps.genFunctionalLcov.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-lcov-${{ matrix.group }}
          path: lcov.functional.${{ matrix.group }}.info

      - name: Zip log files on failure
        if: steps.funcTestsRun.outcome == 'failure'
        # Keep only service/test logs and results.json; the full _dd can reach hundreds of MBs.
        # An env-init failure leaves no `logs/*.log`, so "nothing matched" must not fail the step.
        run: |
          find functional-tests/_dd -type f \
            \( -name service.log -o -name results.json -o -path '*/logs/*.log' \) 2>/dev/null \
            | sort > logs.txt
          if [ ! -s logs.txt ]; then
            echo "::warning::no functional-test logs found under functional-tests/_dd"
            exit 0
          fi
          zip -q -@ logs.zip < logs.txt

      - name: Upload logs as build artifact on failure
        if: always() && steps.funcTestsRun.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fntest_dd-${{ matrix.group }}
          path: logs.zip
          retention-days: 30
          if-no-files-found: warn
          compression-level: 0 # already compressed

      - name: Fail job if functional tests fail
        if: always() && steps.funcTestsRun.outcome == 'failure'
        run: |
          echo "Functional tests failed"
          exit 1

  functional-tests-success:
    name: Check that all checks pass
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, discover-groups, build, run]
    timeout-minutes: 60
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
