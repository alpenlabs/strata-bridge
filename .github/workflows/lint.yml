name: lint

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  extract-rust-version:
    name: Extract toolchain version
    runs-on: ubuntu-latest
    outputs:
      nightly-version: ${{ steps.extract-version.outputs.nightly-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract Rust version
        id: extract-version
        uses: $/.github/actions/extract-rust-version

  clippy:
    name: Run clippy on crates
    runs-on: ubuntu-latest
    needs: extract-rust-version
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        env:
          RUST_NIGHTLY: ${{ needs.extract-rust-version.outputs.nightly-version }}
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal
          rustup default "$RUST_NIGHTLY"

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true

      - name: Install FoundationDB
        uses: $/.github/actions/setup-foundationdb # zizmor: ignore[unpinned-uses]

      - name: Install protoc
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y protobuf-compiler

      - run: cargo clippy --workspace --lib --bins --locked --examples --tests --benches --all-features --all-targets
        env:
          RUSTFLAGS: -D warnings
          DATABASE_URL: sqlite://./operator.db

  fmt:
    name: Check code formatting
    runs-on: ubuntu-latest
    needs: extract-rust-version
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        env:
          RUST_NIGHTLY: ${{ needs.extract-rust-version.outputs.nightly-version }}
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rustfmt
          rustup default "$RUST_NIGHTLY"

      - name: cargo fmt check
        run: cargo fmt --all --check

  codespell:
    name: Check code spellings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run codespell
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2

  taplo:
    name: Lint and check formatting of TOML files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAPLO_VERSION: "0.10.0"
      # SHA-256 of the decompressed taplo-linux-x86_64 binary for that version; update both together.
      TAPLO_SHA256: "dad2faf6377d2daa4f4fabf459fe7ccfb98a5448f0d4bca8270ca9acb0409bfe"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore cached taplo
        id: cache-taplo
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/taplo/taplo
          key: taplo-${{ env.TAPLO_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Download taplo
        if: steps.cache-taplo.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/taplo"
          curl -fsSL --proto "=https" --tlsv1.2 \
            --retry 5 --retry-delay 5 --retry-all-errors --retry-max-time 300 \
            "https://github.com/tamasfe/taplo/releases/download/$TAPLO_VERSION/taplo-linux-x86_64.gz" \
            | gzip -d > "$RUNNER_TEMP/taplo/taplo"
          chmod +x "$RUNNER_TEMP/taplo/taplo"

      - name: Save taplo to cache
        if: steps.cache-taplo.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/taplo/taplo
          key: taplo-${{ env.TAPLO_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install taplo
        run: |
          # Checked on every run so a cached binary is held to the same digest as a fresh one.
          echo "$TAPLO_SHA256  $RUNNER_TEMP/taplo/taplo" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/taplo/taplo" /usr/local/bin/taplo
          taplo --version

      - name: Run taplo lint
        run: |
          taplo lint

      - name: Run taplo format check
        run: |
          taplo fmt --check

  lint-success:
    name: Check that lints passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - clippy
      - fmt
      - codespell
      - taplo
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
