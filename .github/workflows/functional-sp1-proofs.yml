# Runs the SP1 proof functional tests with real Succinct network proving, on a
# schedule and on manual dispatch.
#
# Each tick runs the test matrix in two sequential phases (see
# functional-sp1-proofs-run.yml): first with the mock (bundled reduced) mosaic
# circuit, then — only once the mock phase is green — with the real g16 Groth16
# circuit generated in-run. The reduced circuit's verdict is just the deposit
# index's least significant bit rather than real Groth16 verification, so the
# two phases drive the contest game down both counterproof branches (NACK vs
# ACK) while still proving everything with real SP1.
#
# The cron ticks hourly; the actual cadence is controlled by the repository
# variable SP1_FN_TESTS_INTERVAL_HOURS (default 6) via the schedule-gate job,
# because GitHub cannot read vars.* inside on.schedule.cron. Scheduled runs
# skip commits that already passed (cache marker keyed by SHA). Failures are
# reported to Slack through the SLACK_WEBHOOK_URL secret.
name: Functional tests (SP1 proofs)

on:
  schedule:
    - cron: "17 * * * *" # hourly tick; real cadence gated by vars.SP1_FN_TESTS_INTERVAL_HOURS
  workflow_dispatch:
    inputs:
      RUST_LOG:
        description: "Log level"
        required: false
        default: "info"
        type: string
      mosaic_circuit:
        description: "Mosaic circuit phases: both = mock then full (what scheduled runs do); mock / full restrict to a single phase. full generates the real g16 Groth16 circuit in-run (~142 GB, adds hours); mock uses the bundled reduced circuit."
        required: true
        default: "both"
        type: choice
        options: [both, mock, full]
      g16_ref:
        description: "alpenlabs/g16 ref override for the full phase"
        required: false
        type: string

# Scheduled ticks queue behind an in-flight (mock + full phases, many hours)
# proving run instead of cancelling it; manual dispatch keeps the
# cancel-and-restart behavior.
concurrency:
  group: functional-sp1-proofs
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions: {}

jobs:
  schedule-gate:
    name: Decide whether this tick should run
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Check whether this commit already passed
        id: tested
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .sp1-fn-tested-marker
          key: sp1-fn-tested-${{ github.sha }}
          lookup-only: true

      - name: Decide
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INTERVAL_HOURS: ${{ vars.SP1_FN_TESTS_INTERVAL_HOURS }}
          CACHE_HIT: ${{ steps.tested.outputs.cache-hit }}
        # Full logic in .github/scripts/schedule_gate.sh
        run: bash .github/scripts/schedule_gate.sh

  extract-rust-version:
    name: Extract toolchain version
    runs-on: ubuntu-latest
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    outputs:
      nightly-version: ${{ steps.extract-version.outputs.nightly-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract Rust version
        id: extract-version
        uses: ./.github/actions/extract-rust-version

  # Phase 1: bundled reduced circuit. The counterproof over an even deposit
  # index evaluates false in it, covering the NACK branch of the contest game.
  run-mock:
    name: Mock mosaic circuit
    needs: [extract-rust-version, schedule-gate]
    # inputs is empty on schedule events; scheduled runs do both phases.
    if: needs.schedule-gate.outputs.should_run == 'true' && (inputs.mosaic_circuit || 'both') != 'full'
    uses: ./.github/workflows/functional-sp1-proofs-run.yml
    with:
      mosaic_circuit: mock
      rust_log: ${{ inputs.RUST_LOG || 'info' }}
      rust_nightly: ${{ needs.extract-rust-version.outputs.nightly-version }}
    secrets:
      NETWORK_PRIVATE_KEY: ${{ secrets.NETWORK_PRIVATE_KEY }}

  # Phase 2: real g16 Groth16 circuit generated in-run (~142 GB, adds hours),
  # covering the ACK branch. Gated on the mock phase so a broken commit fails
  # fast without burning the full-circuit hours; the skipped alternative in the
  # condition is for full-only dispatches, where run-mock never ran.
  run-full:
    name: Full mosaic circuit
    needs: [extract-rust-version, schedule-gate, run-mock]
    if: >-
      !cancelled() &&
      needs.schedule-gate.outputs.should_run == 'true' &&
      needs.extract-rust-version.result == 'success' &&
      (inputs.mosaic_circuit || 'both') != 'mock' &&
      (needs.run-mock.result == 'success' || needs.run-mock.result == 'skipped')
    uses: ./.github/workflows/functional-sp1-proofs-run.yml
    with:
      mosaic_circuit: full
      g16_ref: ${{ inputs.g16_ref }}
      rust_log: ${{ inputs.RUST_LOG || 'info' }}
      rust_nightly: ${{ needs.extract-rust-version.outputs.nightly-version }}
    secrets:
      NETWORK_PRIVATE_KEY: ${{ secrets.NETWORK_PRIVATE_KEY }}

  # Marks this SHA as tested so later scheduled ticks skip it. Default needs
  # semantics: runs only when the full phase passed (which itself requires a
  # green mock phase, except on full-only dispatches — a manually verified
  # commit is not re-proven on schedule). Mock-only dispatches don't count —
  # they prove less than a scheduled run would.
  mark-tested:
    name: Record commit as tested
    runs-on: ubuntu-latest
    needs: [run-full]
    timeout-minutes: 5
    steps:
      - name: Save tested marker
        run: echo "tested" > .sp1-fn-tested-marker

      - name: Cache tested marker
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .sp1-fn-tested-marker
          key: sp1-fn-tested-${{ github.sha }}

  notify-failure:
    name: Notify Slack on failure
    runs-on: ubuntu-latest
    needs: [schedule-gate, run-mock, run-full, mark-tested]
    if: failure()
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github

      # Expressions cannot slice strings, so the short SHA is composed in bash.
      - name: Compose failure message
        id: msg
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # shellcheck disable=SC2016 # backticks are literal Slack mrkdwn
          {
            echo "text<<MSG_EOF"
            printf '🚨 *%s failed* — commit `%s` (%s run)\n<%s|View run>\n' \
              "$WORKFLOW_NAME" "${COMMIT_SHA:0:7}" "$EVENT_NAME" "$RUN_URL"
            echo "MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack alert
        uses: ./.github/actions/notify-slack # zizmor: ignore[unpinned-uses]
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          message: ${{ steps.msg.outputs.text }}

  functional-sp1-proofs-success:
    name: Check that all SP1 proof tests pass
    runs-on: ubuntu-latest
    if: always()
    # extract-rust-version must be listed: its failure skips both run phases,
    # and a skip is only acceptable when the gate (not a broken dependency)
    # caused it. The run phases also skip legitimately on dispatches restricted
    # to the other circuit mode; a failed mock phase still fails this check
    # through run-mock itself even though it skips run-full.
    needs: [schedule-gate, extract-rust-version, run-mock, run-full]
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: extract-rust-version, run-mock, run-full
