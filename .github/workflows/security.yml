name: Security

on:
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  cargo-audit-setup:
    name: Install cargo-audit
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2

      - name: Stage cargo-audit binary
        run: cp "$(command -v cargo-audit)" "${RUNNER_TEMP}/cargo-audit"

      - name: Upload cargo-audit binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-audit
          path: ${{ runner.temp }}/cargo-audit
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

  supply-chain:
    name: RustSec audit (${{ matrix.lockfile }})
    needs: cargo-audit-setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - Cargo.lock
          - guest-builder/sp1/guest-bridge-proof/Cargo.lock
          - guest-builder/sp1/guest-counterproof/Cargo.lock
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download cargo-audit binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-audit
          path: ${{ runner.temp }}/cargo-audit

      - name: Audit lockfile
        run: |
          chmod +x "${CARGO_AUDIT_BIN}"
          "${CARGO_AUDIT_BIN}" audit --no-yanked --file "${LOCKFILE}"
        env:
          CARGO_AUDIT_BIN: ${{ runner.temp }}/cargo-audit/cargo-audit
          LOCKFILE: ${{ matrix.lockfile }}

  trivy-cargo:
    name: Trivy Cargo.lock scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.69.3
          cache: true

      # Guard for refs that predate .trivyignore.yaml (e.g. before STR-2637 merges).
      - name: Ensure .trivyignore.yaml exists
        run: |
          if [[ ! -f .trivyignore.yaml ]]; then
            touch .trivyignore.yaml
          fi

      # Hard gate — fails the check if unfixed CRITICAL or HIGH CVEs are found in any
      # Cargo.lock in the repo. Complements cargo audit (RustSec DB) with CVE/GHSA coverage.
      # Add justified exceptions to .trivyignore via PR.
      - name: Scan Cargo.lock with Trivy (hard gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"
          format: table
          trivyignores: .trivyignore.yaml
          skip-dirs: functional-tests
          hide-progress: "true"
          skip-setup-trivy: "true"

      # Advisory SARIF — runs even if the hard gate failed so findings are always visible
      # in the Security tab for triage.
      - name: Scan Cargo.lock with Trivy (SARIF — Security tab)
        id: trivy_sarif_cargo
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "0"
          format: sarif
          output: trivy-cargo.sarif
          trivyignores: .trivyignore.yaml
          skip-dirs: functional-tests
          hide-progress: "true"
          skip-setup-trivy: "true"

      - name: Upload SARIF to GitHub Security tab
        if: steps.trivy_sarif_cargo.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          sarif_file: trivy-cargo.sarif
          category: cargo-fs
