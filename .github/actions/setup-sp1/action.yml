name: Setup SP1 toolchain
description: Installs a pinned SP1 release (cargo-prove plus the succinct Rust toolchain), optionally cached across runs

inputs:
  version:
    description: "SP1 release tag to install (for example v6.2.0)"
    required: true
  cache:
    description: "Restore and save ~/.sp1 in the Actions cache; disable for workflows that publish artifacts"
    required: false
    default: "true"
  github-token:
    description: "Token for the GitHub API calls sp1up makes; raises the shared unauthenticated rate limit"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Restore cached SP1 toolchain
      if: inputs.cache == 'true'
      id: cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.sp1
        key: sp1-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install SP1 toolchain
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SP1_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # This is what `curl https://sp1.succinct.xyz | bash` does, minus the shell-profile edits,
        # with retries on the download.
        mkdir -p "$HOME/.sp1/bin"
        curl -fsSL --proto "=https" --tlsv1.2 \
          --retry 5 --retry-delay 5 --retry-all-errors --retry-max-time 300 \
          -o "$HOME/.sp1/bin/sp1up" \
          "https://raw.githubusercontent.com/succinctlabs/sp1/main/sp1up/sp1up"
        chmod +x "$HOME/.sp1/bin/sp1up"

        args=(--version "$SP1_VERSION")
        if [ -n "$GITHUB_TOKEN" ]; then
          args+=(--token "$GITHUB_TOKEN")
        fi
        # sp1up fetches cargo-prove and the toolchain from GitHub releases without retrying.
        for attempt in 1 2 3 4 5; do
          if "$HOME/.sp1/bin/sp1up" "${args[@]}"; then
            break
          fi
          if [ "$attempt" -eq 5 ]; then
            echo "::error::sp1up failed after ${attempt} attempts"
            exit 1
          fi
          echo "sp1up attempt ${attempt} failed; retrying in $((attempt * 10))s"
          sleep $((attempt * 10))
        done

    - name: Save SP1 toolchain to cache
      if: inputs.cache == 'true' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.sp1
        key: sp1-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Link cached succinct toolchain into rustup
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        # sp1up links ~/.sp1/toolchains/<random> into rustup as `succinct`; the cache only
        # holds ~/.sp1, so recreate the link.
        toolchain_dir="$(find "$HOME/.sp1/toolchains" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
        if [ -z "$toolchain_dir" ]; then
          echo "::error::no succinct toolchain found under ~/.sp1/toolchains"
          exit 1
        fi
        rustup toolchain link succinct "$toolchain_dir"

    - name: Add SP1 to PATH
      shell: bash
      # The appended entry is a fixed path, not derived from any input.
      run: echo "$HOME/.sp1/bin" >> "$GITHUB_PATH" # zizmor: ignore[github-env]

    - name: Verify SP1 toolchain
      shell: bash
      run: |
        "$HOME/.sp1/bin/cargo-prove" prove --version
        rustup run succinct rustc --version
