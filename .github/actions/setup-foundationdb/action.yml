name: Setup FoundationDB Client
description: Installs FoundationDB client library (required for compilation and runtime linking)

inputs:
  version:
    description: "FoundationDB version to install"
    required: false
    default: "7.3.43"
  sha256:
    description: "SHA-256 of the client .deb for `version`; update both together"
    required: false
    default: "c3fa0a59c7355b914a1455dac909238d5ea3b6c6bc7b530af8597e6487c1651a"

runs:
  using: composite
  steps:
    - name: Restore cached FoundationDB client package
      id: cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/fdb-clients/foundationdb-clients_${{ inputs.version }}-1_amd64.deb
        key: fdb-clients-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Download FoundationDB client package
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FDB_VERSION: ${{ inputs.version }}
        FDB_DIR: ${{ runner.temp }}/fdb-clients
      run: |
        echo "::group::Downloading FoundationDB client ${FDB_VERSION}"
        mkdir -p "${FDB_DIR}"
        # GitHub's release CDN returns transient 5xx; retry instead of failing the job.
        curl -fsSL --proto "=https" --tlsv1.2 \
          --retry 5 --retry-delay 5 --retry-all-errors --retry-max-time 300 \
          -o "${FDB_DIR}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb" \
          "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
        echo "::endgroup::"

    - name: Save FoundationDB client package to cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/fdb-clients/foundationdb-clients_${{ inputs.version }}-1_amd64.deb
        key: fdb-clients-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install FoundationDB client package
      shell: bash
      env:
        FDB_VERSION: ${{ inputs.version }}
        FDB_SHA256: ${{ inputs.sha256 }}
        FDB_DIR: ${{ runner.temp }}/fdb-clients
      run: |
        echo "::group::Installing FoundationDB client ${FDB_VERSION}"
        cd "${FDB_DIR}"
        echo "${FDB_SHA256}  foundationdb-clients_${FDB_VERSION}-1_amd64.deb" | sha256sum -c -
        sudo dpkg -i "foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
        echo "::endgroup::"

    - name: Verify installation
      shell: bash
      run: |
        echo "FoundationDB client library installed:"
        ls -la /usr/lib/libfdb_c.so || ls -la /usr/lib/x86_64-linux-gnu/libfdb_c.so || true
        echo ""
        echo "FoundationDB headers installed:"
        ls -la /usr/include/foundationdb/ || true
