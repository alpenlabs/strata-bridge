[advisories]
ignore = [
  # hickory-proto 0.25.2 via libp2p-dns 0.44 / libp2p-mdns 0.48.
  # Patched hickory >=0.26.1 is available through libp2p >=0.57, but the
  # latest strata-p2p tag (v0.4.0) requires libp2p ^0.56. Upgrading only
  # our direct libp2p would introduce incompatible transport/behaviour types.
  # RUSTSEC-2026-0118 requires DNSSEC validation; no dnssec-* feature is
  # enabled. RUSTSEC-2026-0119 affects DNS message encoding, so retain this
  # upstream-blocked DoS exception until strata-p2p supports libp2p >=0.57.
  # https://github.com/libp2p/rust-libp2p/issues/6411
  # https://github.com/libp2p/rust-libp2p/issues/6412
  "RUSTSEC-2026-0118",
  "RUSTSEC-2026-0119",

  # crypto-bigint 0.5.5 via elliptic-curve 0.13 / k256 0.13 in SP1,
  # Alloy, strata-predicate, and zkaleido-native-adapter (including the
  # SP1-patched k256 in both guests). Fix requires crypto-bigint >=0.7.6.
  # k256 0.14 can use the fix, but SP1 6.10.0 still requires k256 ^0.13.4
  # and elliptic-curve ^0.13; upgrading our direct k256 does not fix those
  # copies and breaks the SigningKey API shared with zkaleido's NativeHost.
  # No compatible 0.5.x fix exists. Remove when these upstreams migrate.
  # Residual risk: secret-dependent timing may expose signing keys in the
  # native proof backend and SP1 network signer. This is an accepted,
  # upstream-blocked risk, not a claim that all uses are verification-only.
  "RUSTSEC-2026-0387",

  # scc 2.4.0 via metrics-exporter-otel 0.3.1 -> strata-metrics.
  # Fixed in scc >=3.8.4; latest metrics-exporter-otel still requires ^2.1.
  # serial_test was upgraded to 3.5.0, which removes its scc dependency.
  # The affected code is the ordered tree's Array::insert on a panicking
  # comparator; metrics-exporter-otel uses scc::HashMap, not the tree API.
  # Remove when metrics-exporter-otel accepts a patched scc release.
  "RUSTSEC-2026-0205",

  # zstd 0.13.3 / zstd-safe 7.3.0 via SP1's optional network feature.
  # Fixed in zstd >=0.14.3 / zstd-safe >=8.2.0. SP1 6.10.0 still pins
  # zstd ^0.13, which requires zstd-safe ^7; no compatible fixes exist.
  # zstd-sys was upgraded to 2.1.2, fixing RUSTSEC-2026-0410.
  #
  # SP1's only zstd call is network/client.rs::create_artifact_with_content's encode_all
  # on serialized proving input. Each call creates and finishes a fresh
  # encoder: it does not reuse contexts (0391), decode legacy frames (0403),
  # mix streaming/one-shot operations (0400), train dictionaries (0401),
  # or call OutBuffer::around_pos (0397). The seekable (0396/0398/0405),
  # experimental (0395/0399/0402/0404), and zstdmt (0406) features are disabled.
  # Thus the affected paths are not used by this dependency graph.
  # Remove this group when SP1 upgrades to zstd >=0.14.3.
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0395",
  "RUSTSEC-2026-0396",
  "RUSTSEC-2026-0397",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0399",
  "RUSTSEC-2026-0400",
  "RUSTSEC-2026-0401",
  "RUSTSEC-2026-0402",
  "RUSTSEC-2026-0403",
  "RUSTSEC-2026-0404",
  "RUSTSEC-2026-0405",
  "RUSTSEC-2026-0406",
]
