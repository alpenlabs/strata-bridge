[advisories]
ignore = [
  # tracing-subscriber 0.2.25 pulled by ark-relations 0.5.1 (via ark-groth16).
  # Waiting on arkworks-rs/groth16#90.
  "RUSTSEC-2025-0055",

  # rustls-webpki 0.101.7 pulled by bitreq (via bitcoind-async-client).
  # bitreq still depends on rustls 0.21 which requires 0.101.x; fix needs >=0.103.13.
  # Low risk: only used for bitcoind RPC connections to known/trusted endpoints.
  # Upstream bump to rustls 0.23 / rustls-webpki 0.103 merged but unreleased:
  # https://github.com/rust-bitcoin/corepc/pull/556 (latest published bitreq 0.3.4
  # from 2026-02-17 predates the 2026-04-19 merge). Once released, cargo update
  # will pull rustls-webpki 0.103.13+ via semver on the new branch.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",

  # hickory-proto 0.25.2 pulled transitively via libp2p-mdns 0.48.0 and
  # libp2p-dns 0.44.0 (libp2p 0.56.0 → strata-p2p). Latest published
  # libp2p-mdns 0.48.0 still pins hickory-proto ^0.25.2; blocked on a
  # libp2p upstream release. The bump is in flight in
  # https://github.com/libp2p/rust-libp2p/pull/6395 (open, hickory 0.25 → 0.26).
  #
  # RUSTSEC-2026-0119: O(n²) DNS name compression during message encoding.
  # Fix exists upstream (>=0.26.1) but is unreachable until libp2p bumps.
  # Tracked upstream: https://github.com/libp2p/rust-libp2p/issues/6411.
  #
  # RUSTSEC-2026-0118: NSEC3 closest-encloser proof validation can enter
  # an unbounded loop on cross-zone responses. No fixed upgrade is
  # available. Low risk for this codebase: hickory is only reached via
  # libp2p's peer-discovery/dns paths, and we do not perform DNSSEC
  # validation on untrusted records.
  # Tracked upstream: https://github.com/libp2p/rust-libp2p/issues/6412.
  "RUSTSEC-2026-0118",
  "RUSTSEC-2026-0119",

  # quick-xml 0.37.5 pulled transitively by inferno 0.12.2 (its flamegraph SVG
  # writer) via jemalloc_pprof -> memory_pprof, behind the optional
  # `memory_profiling` feature of strata-bridge / secret-service.
  #
  # Both advisories are denial-of-service bugs in quick-xml's XML *parsing*
  # path: RUSTSEC-2026-0194 (O(n²) duplicate-attribute check on a start tag)
  # and RUSTSEC-2026-0195 (unbounded NsReader namespace-declaration
  # allocation). inferno only uses quick-xml to *write* SVG flamegraphs from
  # local profiling data and never parses untrusted XML, so neither is
  # reachable here.
  #
  # Fix requires quick-xml >= 0.41, but every published inferno (through the
  # latest 0.12.6) still pins quick-xml ^0.37, so the bump is unreachable via
  # semver until inferno upstream updates.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",

  # zstd 0.13.3 / zstd-safe 7.3.0 via SP1's optional network feature.
  # Fixed in zstd >=0.14.3 / zstd-safe >=8.2.0. SP1 6.10.0 still pins
  # zstd ^0.13, which requires zstd-safe ^7; no compatible fixes exist.
  # zstd-sys was upgraded to 2.1.2, fixing RUSTSEC-2026-0410.
  #
  # SP1's only zstd call is network/client.rs::create_artifact_with_content's encode_all
  # on serialized proving input. Each call creates and finishes a fresh
  # encoder: it does not reuse contexts (0391), decode legacy frames (0403),
  # mix streaming/one-shot operations (0400), train dictionaries (0401),
  # or call OutBuffer::around_pos (0397). The seekable (0396/0398/0405),
  # experimental (0395/0399/0402/0404), and zstdmt (0406) features are disabled.
  # Thus the affected paths are not used by this dependency graph.
  # Remove this group when SP1 upgrades to zstd >=0.14.3.
  "RUSTSEC-2026-0391",
  "RUSTSEC-2026-0395",
  "RUSTSEC-2026-0396",
  "RUSTSEC-2026-0397",
  "RUSTSEC-2026-0398",
  "RUSTSEC-2026-0399",
  "RUSTSEC-2026-0400",
  "RUSTSEC-2026-0401",
  "RUSTSEC-2026-0402",
  "RUSTSEC-2026-0403",
  "RUSTSEC-2026-0404",
  "RUSTSEC-2026-0405",
  "RUSTSEC-2026-0406",
]
